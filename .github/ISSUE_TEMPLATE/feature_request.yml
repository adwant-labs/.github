name: Feature request
description: Suggest a focused improvement to an Adwant Labs project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and why it fits the project.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
  - type: textarea
    attributes:
      label: Additional context
      description: Include examples, prior art, or implementation constraints when helpful.
