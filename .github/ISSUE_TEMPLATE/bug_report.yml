name: Bug report
description: Report a reproducible problem in an Adwant Labs project
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, personal data, or undisclosed security vulnerabilities.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
  - type: input
    attributes:
      label: Project version
      description: Which release, commit, or package version are you using?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example and exact steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include relevant operating system, runtime, and dependency versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing secrets and personal data.
